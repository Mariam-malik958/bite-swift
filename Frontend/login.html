<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Bite Swift</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f1e;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: pulse 6s ease-in-out infinite alternate;
    }
    body::before {
      width: 400px; height: 400px;
      background: #e11d48;
      top: -100px; left: -100px;
    }
    body::after {
      width: 350px; height: 350px;
      background: #7c3aed;
      bottom: -100px; right: -100px;
      animation-delay: 3s;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.2); }
    }

    .card {
      width: 420px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #e11d48, #be123c);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(225,29,72,0.4);
    }
    .logo h2 { color: white; font-size: 22px; font-weight: 700; }
    .logo p  { color: #94a3b8; font-size: 13px; margin-top: 4px; }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }
    .form-group label {
      display: block;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 7px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i.icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 15px;
    }
    .input-wrap input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: rgba(15,23,42,0.8);
      border: 1.5px solid #334155;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: #e11d48;
      box-shadow: 0 0 0 3px rgba(225,29,72,0.2);
    }
    .input-wrap input::placeholder { color: #475569; }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(225,29,72,0.4); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      text-align: center;
      font-size: 14px;
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }
    .msg.error   { background: rgba(239,68,68,0.15); color: #f87171; display: block; }
    .msg.success { background: rgba(16,185,129,0.15); color: #34d399; display: block; }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      color: #64748b;
      font-size: 14px;
    }
    .footer-link a {
      color: #e11d48;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
    <h2>Bite Swift Admin</h2>
    <p>Sign in to your admin dashboard</p>
  </div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <i class="fas fa-user icon"></i>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock icon"></i>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
    </div>

    <button type="submit" class="btn" id="loginBtn">
      <span class="spinner" id="spinner"></span>
      <span id="btnText"><i class="fas fa-sign-in-alt"></i> Login to Dashboard</span>
    </button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="footer-link">
    Don't have an account? <a href="admin-signup.html">Create one</a>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');
  const msgEl = document.getElementById('msg');

  // If already logged in, go to dashboard
  if (localStorage.getItem('token')) {
    window.location.href = 'dashboard.html';
  }

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + type;
  }

  function setLoading(loading) {
    btn.disabled = loading;
    spinner.style.display = loading ? 'block' : 'none';
    btnText.style.display = loading ? 'none' : 'flex';
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showMsg('Please enter username and password.', 'error');
      return;
    }

    setLoading(true);
    msgEl.className = 'msg';

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (data.success) {
        localStorage.setItem('token', data.token);
        showMsg('Login successful! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } else {
        showMsg(data.message || 'Invalid username or password.', 'error');
        setLoading(false);
      }
    } catch (err) {
      showMsg('Cannot connect to server. Make sure the server is running.', 'error');
      setLoading(false);
    }
  });
</script>

</body>
</html>
