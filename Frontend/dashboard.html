<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Bite Swift</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .sidebar {
      height: 100vh;
      width: 250px;
      position: fixed;
      top: 0;
      left: 0;
      background: #1e293b;
      padding-top: 20px;
      border-right: 1px solid #334155;
    }
    .sidebar h2 {
      color: #e11d48;
      text-align: center;
      margin-bottom: 30px;
      font-weight: 700;
    }
    .sidebar a {
      padding: 15px 25px;
      text-decoration: none;
      font-size: 16px;
      color: #94a3b8;
      display: block;
      transition: 0.3s;
    }
    .sidebar a:hover, .sidebar a.active {
      color: white;
      background: #334155;
      border-left: 4px solid #e11d48;
    }
    .sidebar a i {
      margin-right: 10px;
      width: 20px;
    }
    .main-content {
      margin-left: 250px;
      padding: 30px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .card-header {
      background: #334155;
      border-bottom: 1px solid #475569;
      color: white;
      font-weight: 600;
      border-radius: 12px 12px 0 0 !important;
    }
    .table {
      color: #cbd5e1;
      margin-bottom: 0;
    }
    .table thead th {
      border-bottom: 2px solid #475569;
      color: #94a3b8;
    }
    .table td {
      border-bottom: 1px solid #334155;
      vertical-align: middle;
    }
    .badge-pending { background: #f59e0b; color: black; padding: 5px 10px; border-radius: 20px; }
    .badge-delivered { background: #10b981; color: white; padding: 5px 10px; border-radius: 20px; }
    .btn-action { margin-right: 5px; }
    .item-list {
      font-size: 13px;
      color: #94a3b8;
      margin: 0;
      padding-left: 15px;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Bite Swift</h2>
  <a href="#" class="active"><i class="fas fa-shopping-bag"></i> Orders</a>
  <a href="#"><i class="fas fa-utensils"></i> Products</a>
  <a href="#"><i class="fas fa-calendar-check"></i> Bookings</a>
  <a href="#" onclick="logout()" style="margin-top: 50px; color: #ef4444;"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<div class="main-content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 style="font-weight: 600;"><i class="fas fa-tachometer-alt"></i> Dashboard</h3>
    <button class="btn btn-primary" style="background:#e11d48; border:none;" onclick="document.getElementById('productSection').classList.toggle('d-none')">
      <i class="fas fa-plus"></i> Add Product
    </button>
  </div>

  <!-- Add Product Section (Hidden by default) -->
  <div id="productSection" class="card d-none mb-4">
    <div class="card-header">Add New Product</div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-5">
          <input id="pname" class="form-control bg-dark text-white border-secondary" placeholder="Product Name">
        </div>
        <div class="col-md-5">
          <input id="pprice" type="number" class="form-control bg-dark text-white border-secondary" placeholder="Price (Rs)">
        </div>
        <div class="col-md-2">
          <button class="btn btn-success w-100" onclick="addProduct()">Add</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Orders Table -->
  <div class="card shadow-lg">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Recent Orders</span>
      <button class="btn btn-sm btn-outline-light" onclick="loadOrders()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-borderless">
          <thead>
            <tr>
              <th>Date</th>
              <th>Customer</th>
              <th>Items Ordered</th>
              <th>Total (Rs)</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTable">
            <tr><td colspan="6" class="text-center py-4">Loading orders...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
const token = localStorage.getItem("token");
if(!token) {
  window.location = "login.html";
}

function formatDate(dateString) {
  const d = new Date(dateString);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}

function loadOrders() {
  fetch("/orders", {
    headers: { Authorization: token }
  })
  .then(r => {
    if(r.status === 401) {
      localStorage.clear();
      window.location = "login.html";
      throw new Error("Unauthorized");
    }
    return r.json();
  })
  .then(data => {
    let html = "";
    if(data.length === 0) {
      html = `<tr><td colspan="6" class="text-center py-4 text-muted">No orders found.</td></tr>`;
    } else {
      data.forEach(o => {
        let itemsHtml = "<ul class='item-list'>";
        if(o.items && o.items.length > 0) {
          o.items.forEach(item => {
            itemsHtml += `<li>${item.quantity}x ${item.name} (Rs.${item.price})</li>`;
          });
        } else {
          itemsHtml += `<li>${o.product || 'Unknown Item'}</li>`; // Fallback for old orders
        }
        itemsHtml += "</ul>";

        const statusBadge = o.status === "Delivered" ? "badge-delivered" : "badge-pending";

        html += `
        <tr>
          <td><small class="text-muted">${formatDate(o.createdAt || Date.now())}</small></td>
          <td>
            <strong>${o.name}</strong><br>
            <small class="text-muted"><i class="fas fa-phone"></i> ${o.phone}</small><br>
            <small class="text-muted"><i class="fas fa-map-marker-alt"></i> ${o.address}</small>
          </td>
          <td>${itemsHtml}</td>
          <td class="fw-bold text-success">Rs. ${o.totalAmount || (o.price || 0)}</td>
          <td><span class="${statusBadge}">${o.status}</span></td>
          <td>
            ${o.status !== "Delivered" ? `<button class="btn btn-sm btn-outline-success btn-action" onclick="done('${o._id}')" title="Mark Delivered"><i class="fas fa-check"></i></button>` : ''}
            <button class="btn btn-sm btn-outline-danger btn-action" onclick="del('${o._id}')" title="Delete Order"><i class="fas fa-trash"></i></button>
          </td>
        </tr>`;
      });
    }
    document.getElementById("ordersTable").innerHTML = html;
  })
  .catch(err => console.log(err));
}

loadOrders();

function del(id) {
  if(confirm("Are you sure you want to delete this order?")) {
    fetch("/order/"+id, {
      method: "DELETE",
      headers: { Authorization: token }
    }).then(() => loadOrders());
  }
}

function done(id) {
  fetch("/order/"+id, {
    method: "PUT",
    headers: { Authorization: token }
  }).then(() => loadOrders());
}

function addProduct() {
  const name = document.getElementById("pname").value;
  const price = document.getElementById("pprice").value;
  if(!name || !price) return alert("Please fill all fields");

  fetch("/product", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: token
    },
    body: JSON.stringify({ name, price })
  }).then(res => res.json()).then(data => {
    alert("Product Added Successfully!");
    document.getElementById("pname").value = "";
    document.getElementById("pprice").value = "";
    document.getElementById("productSection").classList.add("d-none");
  });
}

function logout() {
  localStorage.clear();
  window.location = "login.html";
}
</script>
</body>
</html>
