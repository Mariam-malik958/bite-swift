<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Signup – Bite Swift</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f1e;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: pulse 6s ease-in-out infinite alternate;
    }
    body::before {
      width: 400px; height: 400px;
      background: #7c3aed;
      top: -100px; left: -100px;
    }
    body::after {
      width: 350px; height: 350px;
      background: #e11d48;
      bottom: -100px; right: -100px;
      animation-delay: 3s;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.2); }
    }

    .card {
      width: 420px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(124,58,237,0.4);
    }
    .logo h2 { color: white; font-size: 22px; font-weight: 700; }
    .logo p  { color: #94a3b8; font-size: 13px; margin-top: 4px; }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 7px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i.icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 15px;
    }
    .input-wrap input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: rgba(15,23,42,0.8);
      border: 1.5px solid #334155;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
    }
    .input-wrap input::placeholder { color: #475569; }

    .strength-bar {
      margin-top: 8px;
      height: 4px;
      border-radius: 4px;
      background: #334155;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s, background 0.3s;
      width: 0%;
    }
    .strength-text { font-size: 12px; color: #64748b; margin-top: 4px; }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,58,237,0.4); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      text-align: center;
      font-size: 14px;
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }
    .msg.error   { background: rgba(239,68,68,0.15); color: #f87171; display: block; }
    .msg.success { background: rgba(16,185,129,0.15); color: #34d399; display: block; }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      color: #64748b;
      font-size: 14px;
    }
    .footer-link a {
      color: #7c3aed;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-user-shield"></i></div>
    <h2>Create Admin Account</h2>
    <p>Register to manage Bite Swift Restaurant</p>
  </div>

  <form id="signupForm" novalidate>
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <i class="fas fa-user icon"></i>
        <input type="text" id="username" placeholder="Choose a username" autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock icon"></i>
        <input type="password" id="password" placeholder="Choose a strong password" autocomplete="new-password">
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-text" id="strengthText"></div>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock icon"></i>
        <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password">
      </div>
    </div>

    <button type="submit" class="btn" id="signupBtn">
      <span class="spinner" id="spinner"></span>
      <span id="btnText"><i class="fas fa-user-plus"></i> Create Account</span>
    </button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="footer-link">
    Already have an account? <a href="login.html">Login here</a>
  </div>
</div>

<script>
  const form = document.getElementById('signupForm');
  const btn = document.getElementById('signupBtn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');
  const msgEl = document.getElementById('msg');
  const passInput = document.getElementById('password');
  const strengthFill = document.getElementById('strengthFill');
  const strengthText = document.getElementById('strengthText');

  // Password strength meter
  passInput.addEventListener('input', function() {
    const val = this.value;
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const colors = ['', '#ef4444', '#f59e0b', '#f59e0b', '#22c55e', '#10b981'];
    const labels = ['', 'Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];

    strengthFill.style.width = (score * 20) + '%';
    strengthFill.style.background = colors[score] || '#334155';
    strengthText.textContent = val.length ? labels[score] : '';
    strengthText.style.color = colors[score] || '#64748b';
  });

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + type;
  }

  function setLoading(loading) {
    btn.disabled = loading;
    spinner.style.display = loading ? 'block' : 'none';
    btnText.style.display = loading ? 'none' : 'flex';
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;

    msgEl.className = 'msg';

    if (!username || !password || !confirm) {
      showMsg('Please fill in all fields.', 'error'); return;
    }
    if (username.length < 3) {
      showMsg('Username must be at least 3 characters.', 'error'); return;
    }
    if (password.length < 6) {
      showMsg('Password must be at least 6 characters.', 'error'); return;
    }
    if (password !== confirm) {
      showMsg('Passwords do not match.', 'error'); return;
    }

    setLoading(true);

    try {
      const res = await fetch('/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (data.success) {
        showMsg('Account created successfully! Redirecting to login...', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } else {
        showMsg(data.message || 'Signup failed. Try a different username.', 'error');
        setLoading(false);
      }
    } catch (err) {
      showMsg('Cannot connect to server. Make sure the server is running.', 'error');
      setLoading(false);
    }
  });
</script>

</body>
</html>
